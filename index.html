<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C8641B">
<title>Daily Driver Check</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Driver Check">
</head>
<body>
<style>
  :root {
    --paper: #F4F6F7;
    --card: #FFFFFF;
    --ink: #1B2530;
    --ink-soft: #5A6875;
    --line: #DDE3E8;
    --accent: #C8641B;        /* road-work amber-orange */
    --accent-ink: #FFFFFF;
    --ok: #217A4B;
    --ok-soft: #E2F2E9;
    --issue: #B93A32;
    --issue-soft: #F9E7E5;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151B21;
      --card: #1F2830;
      --ink: #EDF1F4;
      --ink-soft: #9AA8B4;
      --line: #33404B;
      --accent: #E08935;
      --accent-ink: #1B1206;
      --ok: #4CBF85;
      --ok-soft: #1D3A2C;
      --issue: #E4756C;
      --issue-soft: #46231F;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 48px; }

  header.app {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 8px 2px 14px;
  }
  header.app h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
  header.app .date { color: var(--ink-soft); font-size: 15px; white-space: nowrap; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }

  .label {
    display: block;
    font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  input[type="text"], textarea {
    width: 100%;
    font: inherit; color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
  }
  input:focus, textarea:focus, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  .btn {
    display: block; width: 100%;
    font: inherit; font-size: 18px; font-weight: 700;
    padding: 16px;
    border-radius: var(--radius);
    border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  .btn.secondary {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--line);
    font-weight: 600;
  }
  .btn + .btn { margin-top: 10px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  a.btn { text-decoration: none; text-align: center; }
  .btn.call { background: var(--issue); color: #FFFFFF; }
  .call-line {
    display: block; text-align: center;
    margin-top: 16px; font-size: 15px; font-weight: 600;
    color: var(--ink-soft);
  }
  .call-line a { color: var(--accent); white-space: nowrap; }
  .callbar {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10;
    max-width: 516px; margin: 0 auto;
    display: block; text-align: center; text-decoration: none;
    background: var(--issue); color: #FFFFFF;
    font-weight: 700; font-size: 17px;
    padding: 15px; border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  }
  .callbar[hidden] { display: none; }
  #screen-check { padding-bottom: 84px; }

  /* checklist */
  .progress {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    padding: 10px 2px;
    font-size: 14px; color: var(--ink-soft);
  }
  .progress .bar {
    height: 6px; border-radius: 3px;
    background: var(--line); margin-top: 6px; overflow: hidden;
  }
  .progress .fill {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.2s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .progress .fill { transition: none; }
  }

  .check {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .check .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .check .name { font-weight: 600; }
  .check .hint { font-size: 14px; color: var(--ink-soft); margin-top: 1px; }
  .choices { display: flex; gap: 8px; flex-shrink: 0; }
  .choice {
    font: inherit; font-size: 15px; font-weight: 700;
    min-width: 52px; padding: 12px 9px;
    border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--line);
    background: transparent; color: var(--ink-soft);
  }
  .choice.ok.sel   { background: var(--ok-soft);    border-color: var(--ok);    color: var(--ok); }
  .choice.bad.sel  { background: var(--issue-soft); border-color: var(--issue); color: var(--issue); }
  .choice.na.sel   { background: var(--line);       border-color: var(--ink-soft); color: var(--ink); }
  .check .issue-box { display: none; margin-top: 12px; }
  .check.has-issue .issue-box { display: block; }
  .check.has-issue { border-color: var(--issue); }
  .check textarea { min-height: 64px; }

  .photo-btn {
    font: inherit; font-size: 15px; font-weight: 600;
    margin-top: 10px; padding: 10px 14px;
    border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--line);
    background: transparent; color: var(--ink);
  }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .thumb { position: relative; }
  .thumb img {
    width: 72px; height: 72px; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--line); display: block;
  }
  .thumb button {
    position: absolute; top: -8px; right: -8px;
    width: 24px; height: 24px; border-radius: 12px;
    border: none; cursor: pointer;
    background: var(--issue); color: #fff;
    font-size: 14px; line-height: 1; font-weight: 700;
  }

  /* summary */
  .sum-list { margin: 0; padding: 0; list-style: none; }
  .sum-list li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .sum-list li:last-child { border-bottom: none; }
  .pill {
    font-size: 13px; font-weight: 700; white-space: nowrap;
    padding: 3px 10px; border-radius: 99px;
  }
  .pill.ok    { background: var(--ok-soft);    color: var(--ok); }
  .pill.issue { background: var(--issue-soft); color: var(--issue); }
  .pill.na    { background: var(--line);       color: var(--ink-soft); }
  .sum-note { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }

  .banner {
    border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px;
    font-weight: 600;
  }
  .banner.ok    { background: var(--ok-soft);    color: var(--ok); }
  .banner.issue { background: var(--issue-soft); color: var(--issue); }

  .sig-card h2 {
    font-size: 12px; font-weight: 700; margin: 0 0 8px;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  #sigPad {
    width: 100%; height: 120px;
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 10px;
    touch-action: none; display: block;
  }
  .sig-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .sig-row span { font-size: 14px; color: var(--ink-soft); }
  .sig-row button {
    font: inherit; font-size: 14px; font-weight: 600;
    border: none; background: none; cursor: pointer;
    color: var(--accent);
  }

  .history h2 { font-size: 15px; color: var(--ink-soft); margin: 22px 0 8px; }
  .history .item {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 2px; border-bottom: 1px solid var(--line);
    font-size: 15px; color: var(--ink-soft);
    cursor: pointer;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 10px 18px; border-radius: 99px;
    font-size: 15px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>

<div class="wrap">
  <header class="app">
    <h1>Daily Driver Check</h1>
    <span class="date" id="today"></span>
  </header>

  <!-- Screen 1: who's driving -->
  <section class="screen active" id="screen-start">
    <div class="card">
      <div class="field">
        <label class="label" for="driver">Your name</label>
        <input type="text" id="driver" autocomplete="name" placeholder="e.g. Sam">
      </div>
      <div class="field">
        <label class="label" for="vehicle">Vehicle / registration</label>
        <input type="text" id="vehicle" autocapitalize="characters" placeholder="e.g. TRUCK 7 - XR52 KLM">
      </div>
      <div class="field">
        <label class="label" for="trailer">Trailer 1 (leave blank if none)</label>
        <input type="text" id="trailer" autocapitalize="characters" placeholder="e.g. TRL 2">
      </div>
      <div class="field">
        <label class="label" for="trailer2">Trailer 2 (road trains)</label>
        <input type="text" id="trailer2" autocapitalize="characters" placeholder="Leave blank if none">
      </div>
      <div class="field">
        <label class="label" for="dolly">Dolly (road trains)</label>
        <input type="text" id="dolly" autocapitalize="characters" placeholder="Leave blank if none">
      </div>
      <div class="field">
        <label class="label" for="mileage">Odometer in km</label>
        <input type="text" id="mileage" inputmode="numeric" placeholder="e.g. 84200">
      </div>
    </div>
    <button class="btn" id="startBtn">Start today's check</button>
    <p class="call-line">Urgent problem with a vehicle? <a href="tel:0460368001">Call the manager - 0460 368 001</a></p>
    <div class="history" id="history"></div>
  </section>

  <!-- Screen 2: the checklist -->
  <section class="screen" id="screen-check">
    <div class="progress">
      <span id="progressText">0 of 0 checked</span>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
    </div>
    <div id="checklist"></div>
    <button class="btn" id="finishBtn" disabled>Finish check</button>
    <button class="btn secondary" id="backBtn">Back</button>
  </section>

  <!-- Screen 3: summary + sign + send -->
  <section class="screen" id="screen-done">
    <div class="banner" id="resultBanner"></div>
    <div class="card">
      <ul class="sum-list" id="summaryList"></ul>
    </div>
    <div class="card sig-card">
      <h2>Sign to confirm this check</h2>
      <canvas id="sigPad"></canvas>
      <div class="sig-row">
        <span id="sigStatus">Sign with your finger</span>
        <button type="button" id="sigClear">Clear</button>
      </div>
    </div>
    <a class="btn call" id="callBtn" href="tel:0460368001" hidden>Call the manager now - 0460 368 001</a>
    <button class="btn" id="shareBtn" hidden>Send report + photos</button>
    <button class="btn secondary" id="emailBtn" hidden>Email report (text only)</button>
    <button class="btn secondary" id="newBtn">Done - back to start</button>
  </section>
</div>

<a class="callbar" id="callBar" href="tel:0460368001" hidden>Issue found? Call the manager - 0460 368 001</a>

<div class="toast" id="toast"></div>

<script>
  const MANAGER_EMAIL = "murrayhawthorn2004@outlook.com";
  const MAX_PHOTOS = 3;

  const ITEMS = [
    { name: "Lights, indicators & reflectors", hint: "All units - lamps, indicators, reflectors and plates clean and working" },
    { name: "Tyres & wheels", hint: "All units - tread, pressure, no cuts or bulges, wheel nuts tight" },
    { name: "Brakes", hint: "Air builds to pressure, no leaks or warnings, park brake holds" },
    { name: "Couplings & connections", hint: "Turntable/kingpin locked, dolly hitched right, pins in, air lines & electrical leads secure on every unit" },
    { name: "Load restraint", hint: "Load secured and within limits - N/A if running empty" },
    { name: "Straps, chains & tensioners", hint: "Good condition, no cuts or frays, enough for the load - N/A if none carried" },
    { name: "Curtains & buckles", hint: "Tautliners - curtains slide and tension, buckles all work, no rips - N/A if not a tautliner" },
    { name: "Mirrors & windscreen", hint: "Clean, adjusted, no cracks, wipers and washers work" },
    { name: "Oil, coolant & fuel", hint: "Levels OK, no leaks under vehicle, no warning lights" },
    { name: "Horn & reversing alarm", hint: "Both working" },
    { name: "Bodywork & damage", hint: "Walk around every unit - note any new damage" },
    { name: "Doors & tailgate", hint: "Close, latch and lock properly" },
    { name: "Inside the cab", hint: "Seatbelt OK, licence, work diary & documents on board" },
  ];

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let answers = []; // { status: "ok" | "issue" | null, note: "", photos: [] }

  const todayLabel = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  const timeNow = () => new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  $("today").textContent = todayLabel;

  // Remember driver + vehicle between days
  $("driver").value = store.get("driverName", "");
  $("vehicle").value = store.get("vehicleName", "");
  $("trailer").value = store.get("trailerName", "");
  $("trailer2").value = store.get("trailer2Name", "");
  $("dolly").value = store.get("dollyName", "");

  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
    if (id !== "screen-check") $("callBar").hidden = true;
    if (id === "screen-done") setupSignature();
    window.scrollTo(0, 0);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---------- start screen ----------
  $("startBtn").addEventListener("click", () => {
    const driver = $("driver").value.trim();
    const vehicle = $("vehicle").value.trim();
    if (!driver) { toast("Please enter your name"); $("driver").focus(); return; }
    if (!vehicle) { toast("Please enter the vehicle"); $("vehicle").focus(); return; }
    if (!$("mileage").value.trim()) { toast("Please enter the odometer reading"); $("mileage").focus(); return; }
    store.set("driverName", driver);
    store.set("vehicleName", vehicle);
    store.set("trailerName", $("trailer").value.trim());
    store.set("trailer2Name", $("trailer2").value.trim());
    store.set("dollyName", $("dolly").value.trim());
    buildChecklist();
    show("screen-check");
  });

  function renderHistory() {
    const hist = store.get("history", []);
    const box = $("history");
    box.innerHTML = "";
    if (!hist.length) return;
    const h2 = document.createElement("h2");
    h2.textContent = "Recent checks on this phone (tap one to copy its report)";
    box.appendChild(h2);
    hist.slice(0, 7).forEach((h) => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML =
        `<span>${esc(h.date)} - ${esc(h.vehicle)}</span>` +
        `<span class="pill ${h.issues ? "issue" : "ok"}">${h.issues ? h.issues + " issue" + (h.issues > 1 ? "s" : "") : "All OK"}</span>`;
      if (h.report) div.addEventListener("click", () => copyText(h.report));
      box.appendChild(div);
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  renderHistory();

  // ---------- checklist screen ----------
  function buildChecklist() {
    answers = ITEMS.map(() => ({ status: null, note: "", photos: [] }));
    const box = $("checklist");
    box.innerHTML = "";
    ITEMS.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "check";
      div.innerHTML =
        `<div class="row"><div><div class="name">${esc(item.name)}</div>` +
        `<div class="hint">${esc(item.hint)}</div></div>` +
        `<div class="choices">` +
        `<button type="button" class="choice ok" aria-pressed="false">OK</button>` +
        `<button type="button" class="choice bad" aria-pressed="false">Issue</button>` +
        `<button type="button" class="choice na" aria-pressed="false">N/A</button>` +
        `</div></div>` +
        `<div class="issue-box">` +
        `<textarea placeholder="What's wrong? (short note)"></textarea>` +
        `<button type="button" class="photo-btn">&#128247; Add photo of the problem</button>` +
        `<input type="file" accept="image/*" capture="environment" hidden>` +
        `<div class="thumbs"></div>` +
        `</div>`;
      const [okBtn, badBtn, naBtn] = div.querySelectorAll(".choice");
      const noteEl = div.querySelector("textarea");
      const photoBtn = div.querySelector(".photo-btn");
      const fileEl = div.querySelector('input[type="file"]');
      okBtn.addEventListener("click", () => pick(i, "ok", div, okBtn, badBtn, naBtn));
      badBtn.addEventListener("click", () => { pick(i, "issue", div, okBtn, badBtn, naBtn); noteEl.focus(); });
      naBtn.addEventListener("click", () => pick(i, "na", div, okBtn, badBtn, naBtn));
      noteEl.addEventListener("input", () => { answers[i].note = noteEl.value; });
      photoBtn.addEventListener("click", () => {
        if (answers[i].photos.length >= MAX_PHOTOS) { toast("Max " + MAX_PHOTOS + " photos per item"); return; }
        fileEl.click();
      });
      fileEl.addEventListener("change", () => {
        const file = fileEl.files && fileEl.files[0];
        fileEl.value = "";
        if (!file) return;
        compressImage(file, (dataUrl) => {
          answers[i].photos.push(dataUrl);
          renderThumbs(i, div);
        });
      });
      box.appendChild(div);
    });
    updateProgress();
  }

  function renderThumbs(i, div) {
    const box = div.querySelector(".thumbs");
    box.innerHTML = "";
    answers[i].photos.forEach((p, pi) => {
      const t = document.createElement("div");
      t.className = "thumb";
      const img = document.createElement("img");
      img.src = p;
      img.alt = "Defect photo " + (pi + 1);
      const x = document.createElement("button");
      x.type = "button";
      x.innerHTML = "&#215;";
      x.setAttribute("aria-label", "Remove photo");
      x.addEventListener("click", () => { answers[i].photos.splice(pi, 1); renderThumbs(i, div); });
      t.appendChild(img); t.appendChild(x);
      box.appendChild(t);
    });
  }

  function compressImage(file, cb) {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      cb(c.toDataURL("image/jpeg", 0.6));
    };
    img.onerror = () => { toast("Couldn't read that photo"); };
    img.src = URL.createObjectURL(file);
  }

  function pick(i, status, div, okBtn, badBtn, naBtn) {
    answers[i].status = status;
    okBtn.classList.toggle("sel", status === "ok");
    badBtn.classList.toggle("sel", status === "issue");
    naBtn.classList.toggle("sel", status === "na");
    okBtn.setAttribute("aria-pressed", status === "ok");
    badBtn.setAttribute("aria-pressed", status === "issue");
    naBtn.setAttribute("aria-pressed", status === "na");
    div.classList.toggle("has-issue", status === "issue");
    updateProgress();
  }

  function updateProgress() {
    const done = answers.filter((a) => a.status).length;
    $("progressText").textContent = `${done} of ${ITEMS.length} checked`;
    $("progressFill").style.width = (done / ITEMS.length) * 100 + "%";
    $("finishBtn").disabled = done < ITEMS.length;
    $("callBar").hidden = !answers.some((a) => a.status === "issue");
  }

  $("backBtn").addEventListener("click", () => show("screen-start"));

  // ---------- signature pad ----------
  let signed = false;
  let sigCtx = null;
  let drawing = false;

  function setupSignature() {
    const pad = $("sigPad");
    const dpr = window.devicePixelRatio || 1;
    const w = pad.clientWidth, h = pad.clientHeight;
    if (w && pad.width !== Math.round(w * dpr)) {
      pad.width = Math.round(w * dpr); pad.height = Math.round(h * dpr);
      sigCtx = pad.getContext("2d");
      sigCtx.scale(dpr, dpr);
      sigCtx.lineWidth = 2.5;
      sigCtx.lineCap = "round";
      sigCtx.lineJoin = "round";
      sigCtx.strokeStyle = getComputedStyle(document.body).color;
    }
    clearSignature();
  }

  function clearSignature() {
    const pad = $("sigPad");
    if (sigCtx) sigCtx.clearRect(0, 0, pad.width, pad.height);
    signed = false;
    $("sigStatus").textContent = "Sign with your finger";
  }

  const sigPadEl = $("sigPad");
  sigPadEl.addEventListener("pointerdown", (e) => {
    if (!sigCtx) return;
    drawing = true;
    try { sigPadEl.setPointerCapture(e.pointerId); } catch {}
    const r = sigPadEl.getBoundingClientRect();
    sigCtx.beginPath();
    sigCtx.moveTo(e.clientX - r.left, e.clientY - r.top);
    e.preventDefault();
  });
  sigPadEl.addEventListener("pointermove", (e) => {
    if (!drawing || !sigCtx) return;
    const r = sigPadEl.getBoundingClientRect();
    sigCtx.lineTo(e.clientX - r.left, e.clientY - r.top);
    sigCtx.stroke();
    if (!signed) { signed = true; $("sigStatus").textContent = "Signed at " + timeNow(); }
    e.preventDefault();
  });
  sigPadEl.addEventListener("pointerup", () => { drawing = false; });
  sigPadEl.addEventListener("pointercancel", () => { drawing = false; });
  $("sigClear").addEventListener("click", clearSignature);

  // ---------- summary screen ----------
  $("finishBtn").addEventListener("click", () => {
    const issues = answers.filter((a) => a.status === "issue").length;
    const photoCount = answers.reduce((n, a) => n + a.photos.length, 0);
    const banner = $("resultBanner");
    banner.className = "banner " + (issues ? "issue" : "ok");
    banner.textContent = issues
      ? `${issues} issue${issues > 1 ? "s" : ""} found - sign, send the report, and call if it can't wait`
      : "All checks passed - sign below and you're good to go";
    $("callBtn").hidden = !issues;
    $("shareBtn").hidden = !issues || photoCount === 0;
    $("emailBtn").hidden = !issues;

    $("summaryList").innerHTML = ITEMS.map((item, i) => {
      const a = answers[i];
      const bits = [];
      if (a.status === "issue" && a.note.trim()) bits.push(esc(a.note.trim()));
      if (a.photos.length) bits.push(a.photos.length + " photo" + (a.photos.length > 1 ? "s" : ""));
      const note = bits.length ? `<div class="sum-note">${bits.join(" &middot; ")}</div>` : "";
      const cls = a.status === "ok" ? "ok" : a.status === "na" ? "na" : "issue";
      const lbl = a.status === "ok" ? "OK" : a.status === "na" ? "N/A" : "Issue";
      return `<li><div><div>${esc(item.name)}</div>${note}</div>` +
        `<span class="pill ${cls}">${lbl}</span></li>`;
    }).join("");

    const hist = store.get("history", []);
    hist.unshift({ date: todayLabel, vehicle: $("vehicle").value.trim(), issues, report: reportText() });
    store.set("history", hist.slice(0, 30));
    renderHistory();
    show("screen-done");
  });

  function reportText() {
    const driver = $("driver").value.trim();
    const vehicle = $("vehicle").value.trim();
    const mileage = $("mileage").value.trim();
    const issues = answers.filter((a) => a.status === "issue").length;
    const photoCount = answers.reduce((n, a) => n + a.photos.length, 0);
    const lines = [
      "DAILY VEHICLE CHECK",
      `Date: ${todayLabel}, ${timeNow()}`,
      `Driver: ${driver}`,
      `Vehicle: ${vehicle}`,
    ];
    const trailer = $("trailer").value.trim();
    const trailer2 = $("trailer2").value.trim();
    const dolly = $("dolly").value.trim();
    if (trailer) lines.push(`Trailer 1: ${trailer}`);
    if (trailer2) lines.push(`Trailer 2: ${trailer2}`);
    if (dolly) lines.push(`Dolly: ${dolly}`);
    if (mileage) lines.push(`Odometer: ${mileage} km`);
    lines.push("", issues ? `RESULT: ${issues} ISSUE${issues > 1 ? "S" : ""} FOUND` : "RESULT: ALL OK", "");
    ITEMS.forEach((item, i) => {
      const a = answers[i];
      let line = `${a.status === "ok" ? "[OK]" : a.status === "na" ? "[N/A]" : "[ISSUE]"} ${item.name}`;
      if (a.status === "issue" && a.note.trim()) line += ` - ${a.note.trim()}`;
      if (a.photos.length) line += ` (${a.photos.length} photo${a.photos.length > 1 ? "s" : ""})`;
      lines.push(line);
    });
    if (photoCount) lines.push("", `${photoCount} defect photo${photoCount > 1 ? "s" : ""} attached`);
    lines.push("", signed ? `Signed on screen by ${driver} at ${timeNow()}` : "Not signed on screen");
    return lines.join("\n");
  }

  function dataURLtoFile(dataUrl, name) {
    const [meta, b64] = dataUrl.split(",");
    const mime = (meta.match(/:(.*?);/) || [0, "image/jpeg"])[1];
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new File([u8], name, { type: mime });
  }

  $("shareBtn").addEventListener("click", async () => {
    const text = reportText();
    const files = [];
    ITEMS.forEach((item, i) => {
      answers[i].photos.forEach((p, pi) => {
        const safe = item.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        files.push(dataURLtoFile(p, `defect-${safe}-${pi + 1}.jpg`));
      });
    });
    if (signed) {
      try { files.push(dataURLtoFile($("sigPad").toDataURL("image/png"), "signature.png")); } catch {}
    }
    try {
      if (files.length && navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ title: "Daily vehicle check", text, files });
      } else if (navigator.share) {
        await navigator.share({ title: "Daily vehicle check", text });
        toast("Photos couldn't attach - email them separately");
      } else {
        await copyText(text);
      }
    } catch (e) {
      if (!e || e.name !== "AbortError") await copyText(text);
    }
  });

  $("emailBtn").addEventListener("click", () => {
    const vehicle = $("vehicle").value.trim();
    const issues = answers.filter((a) => a.status === "issue").length;
    const subject = `Daily check - ${vehicle} - ${todayLabel}${issues ? ` - ${issues} ISSUE${issues > 1 ? "S" : ""}` : " - all OK"}`;
    window.location.href = `mailto:${MANAGER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(reportText())}`;
  });

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Report copied - paste it anywhere");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("Report copied - paste it anywhere");
    }
  }

  $("newBtn").addEventListener("click", () => {
    $("mileage").value = "";
    clearSignature();
    show("screen-start");
  });

  // ---------- offline support ----------
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
